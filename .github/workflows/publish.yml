name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve upstream office2pdf version
        run: echo "OFFICE2PDF_VERSION=$(bun scripts/upstream-version.ts)" >> "$GITHUB_ENV"

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WebAssembly bundle
        run: bun run wasm:build

      - name: Fetch upstream binaries
        run: bun run binaries:fetch

      - name: Run checks
        run: bun run ci:check

      - name: Publish platform packages
        run: |
          for dir in npm/*/; do
            npm publish "$dir" --access public --provenance
          done

      - name: Publish package
        run: npm publish --access public --provenance
