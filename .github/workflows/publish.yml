name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate everything without publishing"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve upstream office2pdf version
        run: echo "OFFICE2PDF_VERSION=$(bun scripts/upstream-version.ts)" >> "$GITHUB_ENV"

      - name: Fetch upstream binaries
        run: bun run binaries:fetch

      - name: Run checks
        run: bun run ci:check

      - name: Publish platform packages
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          for dir in npm/*/; do
            echo "::group::publish $dir"
            npm publish "$dir" --access public --provenance $DRY_RUN
            echo "::endgroup::"
          done

      - name: Publish package
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: npm publish --access public --provenance $DRY_RUN
